<button class="tab-chip px-space-sm py-1 rounded-full bg-surface-dark/40 backdrop-blur-md text-on-primary/60 hover:text-on-primary transition-all text-label-badge font-label-badge flex items-center gap-1 shadow-sm" id="chip-2" onclick="setSlide(2)" type="button">

</button>

            Handpicked spots across India curated for road trippers and explorers.
          </p>

<!-- Key Feature Tag Ribbon -->
<div class="flex flex-wrap gap-space-xs mt-space-sm pt-space-xs" id="slide-tags">

<span class="px-2 py-0.5 rounded-full bg-surface-dark/60 text-surface-variant font-label-badge text-label-badge">Off-Grid Maps</span>

<button aria-label="Go to Slide 2" class="h-2 rounded-full transition-all duration-300 w-2 bg-on-primary/40" id="dot-1" onclick="setSlide(1)" type="button"></button>
<button aria-label="Go to Slide 3" class="h-2 rounded-full transition-all duration-300 w-2 bg-on-primary/40" id="dot-2" onclick="setSlide(2)" type="button"></button>
</div>
<!-- Micro Navigation Arrows -->

</button>
<button aria-label="Next Slide" class="w-9 h-9 rounded-full bg-surface-dark/80 hover:bg-surface-dark text-on-primary flex items-center justify-center transition-colors shadow-sm" id="next-btn" onclick="nextSlide()" type="button">
<span class="material-symbols-outlined text-body-md">arrow_forward</span>

<!-- Action Footer Stack -->
<div class="flex flex-col w-full gap-space-sm items-center">

</button>

</button>

<script>
  (function() {
    let currentSlide = 0;
    const totalSlides = 3;

    const slidesData = [
      {
        pill: "Curated Travel",
        counter: "01 / 03",
        heading: "Discover places worth finding",
        body: "Handpicked spots across India curated for road trippers and explorers.",
        cta: "Explore Trips",
        tags: [
          "Uncharted Valleys",
          "Off-Grid Maps",
          "Scenic Highway Viewpoints"
        ]
      },
      {
        pill: "Integrated Booking",
        counter: "02 / 03",
        heading: "Plan hotels, rides & rest stops in one go",
        body: "Book boutique heritage stays, verified chauffeurs, and midway highway pauses in a single seamless itinerary.",
        cta: "Preview Stays & Rides",
        tags: [
          "Heritage Haveli Stays",
          "Chauffeur-Driven SUVs",
          "Verified Food Stops"
        ]
      },
      {
        pill: "Assurance Guaranteed",
        counter: "03 / 03",
        heading: "Built for real trips, not just bookings",
        body: "Live concierge support, guaranteed clean stops, and verified corporate or solo routes.",
        cta: "Get Started",
        tags: [
          "24/7 Road Concierge",
          "Clean Restroom Seal",
          "Corporate-Ready Billing"
        ]
      }
    ];

    function updateSlideUI(index) {
      currentSlide = index;

      // Switch Backgrounds
      for (let i = 0; i < totalSlides; i++) {
        const bg = document.getElementById('slide-bg-' + i);
        const dot = document.getElementById('dot-' + i);
        const chip = document.getElementById('chip-' + i);
        const chipDot = document.getElementById('chip-dot-' + i);

        if (i === index) {
          bg.classList.remove('opacity-0', 'pointer-events-none');
          bg.classList.add('opacity-100');

          // Active indicator dot (expanded flat red)
          dot.className = 'h-2 rounded-full transition-all duration-300 w-8 bg-primary-container';

          // Active tab chip
          chip.className = 'tab-chip px-space-sm py-1 rounded-full bg-surface-dark/90 backdrop-blur-md text-on-primary transition-all text-label-badge font-label-badge flex items-center gap-1 shadow-sm';
          chipDot.className = 'w-1.5 h-1.5 rounded-full bg-primary-container inline-block';
        } else {
          bg.classList.remove('opacity-100');
          bg.classList.add('opacity-0', 'pointer-events-none');

          // Inactive indicator dot
          dot.className = 'h-2 rounded-full transition-all duration-300 w-2 bg-on-primary/40';

          // Inactive tab chip
          chip.className = 'tab-chip px-space-sm py-1 rounded-full bg-surface-dark/50 backdrop-blur-md text-on-primary/60 hover:text-on-primary transition-all text-label-badge font-label-badge flex items-center gap-1 shadow-sm';
          chipDot.className = 'w-1.5 h-1.5 rounded-full bg-on-primary/40 inline-block';
        }
      }

      // Update Card Copy with smooth swap
      const data = slidesData[index];
      const headingEl = document.getElementById('slide-heading');
      const bodyEl = document.getElementById('slide-body');
      const pillEl = document.getElementById('slide-pill');
      const counterEl = document.getElementById('slide-counter');
      const ctaLabel = document.getElementById('cta-label');
      const tagsContainer = document.getElementById('slide-tags');

      headingEl.style.opacity = '0';
      bodyEl.style.opacity = '0';

      setTimeout(function() {
        headingEl.textContent = data.heading;
        bodyEl.textContent = data.body;
        pillEl.textContent = data.pill;
        counterEl.textContent = data.counter;
        ctaLabel.textContent = data.cta;

        // Render tags
        tagsContainer.innerHTML = '';
        data.tags.forEach(function(tagText) {
          const span = document.createElement('span');
          span.className = 'px-2 py-0.5 rounded-full bg-surface-dark/60 text-surface-variant font-label-badge text-label-badge';
          span.textContent = tagText;
          tagsContainer.appendChild(span);
        });

        headingEl.style.opacity = '1';
        bodyEl.style.opacity = '1';
      }, 150);
    }

    window.setSlide = function(idx) {
      if (idx >= 0 && idx < totalSlides) {
        updateSlideUI(idx);
      }
    };

    window.nextSlide = function() {
      const nextIndex = (currentSlide + 1) % totalSlides;
      updateSlideUI(nextIndex);
    };

    window.prevSlide = function() {
      const prevIndex = (currentSlide - 1 + totalSlides) % totalSlides;
      updateSlideUI(prevIndex);
    };

    window.handlePrimaryAction = function() {
      if (currentSlide < totalSlides - 1) {
        nextSlide();
      } else {
        // Slide 3 terminal CTA reached
        alert('Welcome to Tripmate! Initializing your journey planner...');
      }
    };

    // Skip directly to Slide 3 or final setup
    const skipBtn = document.getElementById('skip-btn');
    if (skipBtn) {
      skipBtn.addEventListener('click', function() {
        updateSlideUI(2);
      });
    }

    // Touch swipe gesture support for mobile discovery
    let touchStartX = 0;
    let touchEndX = 0;
    const rootEl = document.getElementById('onboarding-root');

    rootEl.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    rootEl.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) {
          // Swipe Left -> Next
          nextSlide();
        } else {
          // Swipe Right -> Prev
          prevSlide();
        }
      }
    }
  })();
</script></main>
