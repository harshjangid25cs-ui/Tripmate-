name = "tripmate-keepalive"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Cloudflare Worker Cron Trigger (fires every 8 minutes)
# Prevents Render free-tier container from sleeping (15-min limit)
# and ensures the WhatsApp worker and Supabase stay active 24/7.
[triggers]
crons = ["*/8 * * * *"]

[vars]
RENDER_HEALTH_URL = "https://tripmate-4lie.onrender.com/health"
